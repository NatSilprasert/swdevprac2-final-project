name: equipment-rental

services:
  db:
    image: mongo:7
    container_name: equipment-rental-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
    name: equipment-rental-mongo-data
